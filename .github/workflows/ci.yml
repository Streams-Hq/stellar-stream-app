name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true

jobs:
  check-and-build:
    name: Lint, Test & Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK unit tests
        run: pnpm --filter @stellar-stream/sdk test

      - name: Build SDK
        run: pnpm --filter @stellar-stream/sdk build

      - name: Build Indexer
        run: pnpm --filter indexer build

      - name: Build Web Application
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
          # Populated from the contracts repo's deploy output. The build does not
          # need a live contract id; runtime reads fall back to on-chain queries.
          NEXT_PUBLIC_STREAM_CONTRACT_ID: ""
          NEXT_PUBLIC_INDEXER_URL: "http://localhost:3001"

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build docs (strict)
        run: mkdocs build --strict
